<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
  <title id="title">Published pet insurance prices, each brand's own competitor table</title>
  <desc id="desc">Two bar charts. Top: Fetch's table for one identical Tampa quote as of March 2026 - Fetch 27.51 dollars, Pets Best 21.91, Spot 19.79, Lemonade 14.97. Bottom: Lemonade's table for one identical Chicago Goldendoodle quote, competitor rows undated - Trupanion 336 dollars, Fetch 99, Healthy Paws 85, Pets Best 77, ManyPets 73, Lemonade 61. Read 2026-09-28.</desc>
  <rect width="720" height="560" fill="#ffffff"/>
  <style>
    .h1 { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #14213a; }
    .cap { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #1f3a68; }
    .note { font: 400 11.5px "Segoe UI", Arial, sans-serif; fill: #5b6678; }
    .name { font: 600 12.5px "Segoe UI", Arial, sans-serif; fill: #24344d; }
    .val { font: 700 12.5px "Segoe UI", Arial, sans-serif; fill: #14213a; }
    .foot { font: 400 11px "Segoe UI", Arial, sans-serif; fill: #5b6678; }
    .axis { font: 400 10.5px "Segoe UI", Arial, sans-serif; fill: #7a8698; }
  </style>

  <text x="24" y="30" class="h1">Two brands publish each other's prices - under different assumptions</text>
  <text x="24" y="50" class="note">Every bar is a monthly premium printed on the brand's own official page; read 2026-09-28.</text>

  <!-- Panel A -->
  <text x="24" y="82" class="cap">Fetch's table: one identical quote - Tampa, FL 33602, 1-y-o small mixed breed, $5,000 / $500 / 80%, no wellness (as of March 2026)</text>
  <line x1="24" y1="92" x2="696" y2="92" stroke="#e4e9ee"/>
  <g>
    <text x="24" y="118" class="name">Fetch</text>
    <rect x="150" y="106" width="413" height="17" fill="#2f6fed"/>
    <text x="571" y="119" class="val">$27.51</text>

    <text x="24" y="150" class="name">Pets Best</text>
    <rect x="150" y="138" width="329" height="17" fill="#8aa4d6"/>
    <text x="487" y="151" class="val">$21.91</text>

    <text x="24" y="182" class="name">Spot</text>
    <rect x="150" y="170" width="297" height="17" fill="#8aa4d6"/>
    <text x="455" y="183" class="val">$19.79</text>

    <text x="24" y="214" class="name">Lemonade</text>
    <rect x="150" y="202" width="225" height="17" fill="#8aa4d6"/>
    <text x="383" y="215" class="val">$14.97</text>
  </g>
  <line x1="150" y1="230" x2="600" y2="230" stroke="#c9d2de"/>
  <text x="150" y="246" class="axis">$0</text>
  <text x="588" y="246" class="axis">$30</text>

  <!-- Panel B -->
  <text x="24" y="286" class="cap">Lemonade's table: one identical quote - 4-y-o Goldendoodle in Chicago, $250 deductible, 80% co-insurance, max limit (competitor rows undated)</text>
  <line x1="24" y1="296" x2="696" y2="296" stroke="#e4e9ee"/>
  <g>
    <text x="24" y="322" class="name">Trupanion</text>
    <rect x="150" y="310" width="432" height="17" fill="#f0883e"/>
    <text x="590" y="323" class="val">$336</text>

    <text x="24" y="354" class="name">Fetch</text>
    <rect x="150" y="342" width="127" height="17" fill="#c9cfe0"/>
    <text x="285" y="355" class="val">$99</text>

    <text x="24" y="386" class="name">Healthy Paws</text>
    <rect x="150" y="374" width="109" height="17" fill="#c9cfe0"/>
    <text x="267" y="387" class="val">$85</text>

    <text x="24" y="418" class="name">Pets Best</text>
    <rect x="150" y="406" width="99" height="17" fill="#c9cfe0"/>
    <text x="257" y="419" class="val">$77</text>

    <text x="24" y="450" class="name">ManyPets</text>
    <rect x="150" y="438" width="94" height="17" fill="#c9cfe0"/>
    <text x="252" y="451" class="val">$73</text>

    <text x="24" y="482" class="name">Lemonade</text>
    <rect x="150" y="470" width="78" height="17" fill="#2f6fed"/>
    <text x="236" y="483" class="val">$61</text>
  </g>
  <line x1="150" y1="498" x2="600" y2="498" stroke="#c9d2de"/>
  <text x="150" y="514" class="axis">$0</text>
  <text x="583" y="514" class="axis">$350</text>

  <text x="24" y="540" class="foot">Sources: fetchpet.com/pet-insurance-cost and lemonade.com/pet/insurance-guide/pet-insurance-cost/, both read 2026-09-28. Different pets, different deductibles, different scales - do not subtract across panels.</text>
</svg>
